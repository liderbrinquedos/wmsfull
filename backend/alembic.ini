[alembic]
# Caminho do diretorio de scripts, relativo a este arquivo.
script_location = alembic

# Necessario para que `app` seja importavel dentro do env.py.
prepend_sys_path = .

# Formato do nome dos arquivos de migracao.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# A URL do banco NAO fica aqui. O env.py le de app.core.config (env var), para
# existir uma unica fonte de verdade e nenhuma senha versionada.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
