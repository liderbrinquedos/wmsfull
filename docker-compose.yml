version: "3.9"

services:

  # ── Banco de Dados PostgreSQL ─────────────────────────────────
  logfull-db:
    image: postgres:16-alpine
    container_name: logfull-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: logfull
      POSTGRES_USER: logfull
      POSTGRES_PASSWORD: logfull123
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logfull"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API Python FastAPI ────────────────────────────────────────
  logfull-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: logfull-api
    restart: unless-stopped
    depends_on:
      logfull-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://logfull:logfull123@logfull-db:5432/logfull
      SECRET_KEY: supersecretkey123changeme
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    ports:
      - "8005:8000"

  # ── Frontend React PWA (Nginx) ────────────────────────────────
  logfull-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: logfull-web
    restart: unless-stopped
    depends_on:
      - logfull-api
    ports:
      - "3005:80"

volumes:
  pgdata:
  uploads:
