services:

  # ── Banco de Dados PostgreSQL ─────────────────────────────────
  logfull-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-logfull}
      POSTGRES_USER: ${POSTGRES_USER:-logfull}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD (ver .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logfull} -d ${POSTGRES_DB:-logfull}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API Python FastAPI ────────────────────────────────────────
  logfull-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      logfull-db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL (ver .env.example)}
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY (openssl rand -hex 32)}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - uploads:/app/uploads
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Frontend React PWA (Nginx) ────────────────────────────────
  logfull-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      logfull-api:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  uploads:
